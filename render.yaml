services:
  - type: web
    name: escalar-ai-pos-api
    branch: agent/escalar-ai-pos-api
    runtime: python
    plan: free
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log --log-config logging.json
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INTEGRATION_SERVICE_TOKEN
        sync: false
      - key: INVITE_REDIRECT_URL
        sync: false
      - key: PUBLIC_API_BASE_URL
        value: https://api.escalarai.tech/api/v1
      - key: POS_PUBLIC_BASE_URL
        value: https://pos.escalarai.tech
      - key: DEVICE_AUTH_SECRET
        sync: false
      - key: AUTH_ADMIN_SECRET
        sync: false
      - key: QZ_TRAY_CERTIFICATE
        sync: false
      - key: QZ_TRAY_PRIVATE_KEY
        sync: false
      - key: LEGACY_PUBLIC_READS_ENABLED
        value: "false"
